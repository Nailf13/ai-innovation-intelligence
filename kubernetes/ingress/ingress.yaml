apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: innovation-intelligence-ingress
  namespace: innovation-intelligence
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "innovation-intelligence-static-ip"
    kubernetes.io/ingress.allow-http: "true"
    cloud.google.com/neg: '{"ingress": true}'
spec:
  rules:
  - host: app.34.8.85.230.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: api.34.8.85.230.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: innovation-backend-config
  namespace: innovation-intelligence
spec:
  timeoutSec: 300
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 8000
