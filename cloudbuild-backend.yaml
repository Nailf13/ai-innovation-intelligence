steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull europe-west1-docker.pkg.dev/$PROJECT_ID/innovation-intelligence/backend:latest || exit 0
    id: 'pull-cache'

  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--cache-from=europe-west1-docker.pkg.dev/$PROJECT_ID/innovation-intelligence/backend:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/innovation-intelligence/backend:$SHORT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/innovation-intelligence/backend:latest'
      - '--platform=linux/amd64'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    id: 'build-image'
    waitFor: ['pull-cache']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/innovation-intelligence/backend'
    id: 'push-image'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'rollout'
      - 'restart'
      - 'deployment/backend-fastapi'
      - '-n'
      - 'innovation-intelligence'
    env:
      - 'CLOUDSDK_CORE_PROJECT=prj-digital-financial-analysis'
      - 'CLOUDSDK_COMPUTE_REGION=europe-west1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=analyse-concurrence-cluster'
    id: 'deploy-gke'
    waitFor: ['push-image']

  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'rollout'
      - 'status'
      - 'deployment/backend-fastapi'
      - '-n'
      - 'innovation-intelligence'
      - '--timeout=10m'
    env:
      - 'CLOUDSDK_CORE_PROJECT=prj-digital-financial-analysis'
      - 'CLOUDSDK_COMPUTE_REGION=europe-west1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=analyse-concurrence-cluster'
    id: 'wait-rollout'
    waitFor: ['deploy-gke']

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/innovation-intelligence/backend:$SHORT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/innovation-intelligence/backend:latest'

timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
